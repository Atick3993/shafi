<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বায়োলজি এক্সাম কুইজ</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1620;
    --panel:#161f2c;
    --panel2:#1c2735;
    --accent:#3ddc97;
    --accent2:#ffb454;
    --bad:#ff6b6b;
    --text:#e8edf2;
    --muted:#8b98a8;
    --border:#2a3646;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Hind Siliguri', sans-serif;
    background:linear-gradient(180deg,#0f1620,#0b1119);
    color:var(--text);
    min-height:100vh;
    padding:20px 12px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{
    text-align:center;
    margin-bottom:18px;
  }
  header h1{
    font-size:1.5rem;
    margin:0 0 4px;
    font-weight:700;
  }
  header p{color:var(--muted);margin:0;font-size:0.9rem;}

  .setup{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
  }
  .chapter-list{display:flex;flex-direction:column;gap:10px;margin:14px 0;}
  .chapter-item{
    display:flex;align-items:center;gap:10px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    cursor:pointer;
    user-select:none;
  }
  .chapter-item input{width:18px;height:18px;accent-color:var(--accent);}
