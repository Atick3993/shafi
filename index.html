<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বায়োলজি এক্সাম কুইজ</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1620;
    --panel:#161f2c;
    --panel2:#1c2735;
    --accent:#3ddc97;
    --accent2:#ffb454;
    --bad:#ff6b6b;
    --text:#e8edf2;
    --muted:#8b98a8;
    --border:#2a3646;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Hind Siliguri', sans-serif;
    background:linear-gradient(180deg,#0f1620,#0b1119);
    color:var(--text);
    min-height:100vh;
    padding:20px 12px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{
    text-align:center;
    margin-bottom:18px;
  }
  header h1{
    font-size:1.5rem;
    margin:0 0 4px;
    font-weight:700;
  }
  header p{color:var(--muted);margin:0;font-size:0.9rem;}

  .setup{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
  }
  .chapter-list{display:flex;flex-direction:column;gap:10px;margin:14px 0;}
  .chapter-item{
    display:flex;align-items:center;gap:10px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    cursor:pointer;
    user-select:none;
  }
  .chapter-item input{width:18px;height:18px;accent-color:var(--accent);}
  .chapter-item .name{flex:1;font-weight:500;}
  .chapter-item .count{color:var(--muted);font-size:0.85rem;}

  .setup-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .setup-row label{font-size:0.85rem;color:var(--muted);display:block;margin-bottom:6px;}
  select{
    background:var(--panel2);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    font-family:inherit;
    font-size:0.9rem;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  .btn-primary{
    background:var(--accent);
    color:#08120d;
    font-weight:700;
    font-size:1rem;
    padding:14px;
    border-radius:12px;
    width:100%;
    margin-top:18px;
  }
  .btn-primary:active{transform:scale(0.99);}
  .btn-secondary{
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent);
    padding:10px 16px;
    border-radius:10px;
    font-weight:600;
  }

  /* Quiz screen */
  .quiz-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    display:none;
  }
  .progress-bar{
    height:6px;
    background:var(--panel2);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:14px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width 0.3s ease;
  }
  .meta-row{
    display:flex;justify-content:space-between;align-items:center;
    color:var(--muted);font-size:0.85rem;margin-bottom:6px;
  }
  .chapter-tag{
    color:var(--accent2);
    font-weight:600;
  }
  .q-text{
    font-size:1.08rem;
    font-weight:600;
    line-height:1.6;
    margin:10px 0 18px;
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:13px 14px;
    font-size:0.98rem;
    display:flex;
    gap:10px;
    align-items:flex-start;
    line-height:1.5;
  }
  .option .letter{
    flex-shrink:0;
    width:24px;height:24px;
    border-radius:50%;
    background:#0f1620;
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:0.8rem;color:var(--muted);
  }
  .option.correct{
    border-color:var(--accent);
    background:rgba(61,220,151,0.12);
  }
  .option.correct .letter{background:var(--accent);color:#08120d;border-color:var(--accent);}
  .option.wrong{
    border-color:var(--bad);
    background:rgba(255,107,107,0.12);
  }
  .option.wrong .letter{background:var(--bad);color:#2a0d0d;border-color:var(--bad);}
  .option.disabled{cursor:default;}
  .option:not(.disabled):active{transform:scale(0.99);}

  .nav-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:20px;
  }
  .next-btn{
    background:var(--accent);
    color:#08120d;
    font-weight:700;
    padding:11px 22px;
    border-radius:10px;
    font-size:0.95rem;
    opacity:0.4;
    pointer-events:none;
    transition:opacity 0.2s;
  }
  .next-btn.active{opacity:1;pointer-events:auto;}
  .skip-btn{color:var(--muted);font-size:0.85rem;background:none;}

  /* Result screen */
  .result-panel{display:none;text-align:center;}
  .score-circle{
    width:150px;height:150px;
    border-radius:50%;
    margin:20px auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--panel2);
    border:6px solid var(--accent);
  }
  .score-circle .num{font-size:2.2rem;font-weight:700;}
  .score-circle .lbl{font-size:0.8rem;color:var(--muted);}
  .result-msg{font-size:1.05rem;margin:10px 0 20px;color:var(--muted);}
  .review-list{text-align:right;margin-top:20px;}
  .review-item{
    background:var(--panel2);
    border:1px solid var(--border);
    border-left:4px solid var(--bad);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:10px;
    font-size:0.92rem;
    line-height:1.6;
  }
  .review-item .ans{color:var(--accent);font-weight:600;}
  .review-item .yours{color:var(--bad);}
  .btn-group{display:flex;gap:10px;margin-top:20px;}
  .btn-group button{flex:1;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧬 বায়োলজি এক্সাম কুইজ</h1>
    <p>৫টি অধ্যায় থেকে সবগুলো প্রশ্ন — এখনই প্র্যাকটিস করো</p>
  </header>

  <div class="setup" id="setupPanel">
    <label style="font-size:0.85rem;color:var(--muted);">যে অধ্যায়গুলো থেকে পরীক্ষা দিতে চাও (একাধিক বাছাই করা যাবে):</label>
    <div class="chapter-list" id="chapterList"></div>

    <div class="setup-row">
      <div>
        <label>প্রশ্নের ক্রম</label>
        <select id="orderSelect">
          <option value="sequential">সিরিয়াল অনুযায়ী</option>
          <option value="random" selected>র‍্যান্ডম</option>
        </select>
      </div>
    </div>

    <button class="btn-primary" id="startBtn">পরীক্ষা শুরু করো</button>
  </div>

  <div class="quiz-panel" id="quizPanel">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="meta-row">
      <span class="chapter-tag" id="chapterTag"></span>
      <span id="qCounter"></span>
    </div>
    <div class="q-text" id="qText"></div>
    <div class="options" id="optionsBox"></div>
    <div class="nav-row">
      <button class="skip-btn" id="skipBtn">এড়িয়ে যাও →</button>
      <button class="next-btn" id="nextBtn">পরবর্তী প্রশ্ন</button>
    </div>
  </div>

  <div class="result-panel" id="resultPanel">
    <div class="score-circle">
      <div class="num" id="scoreNum">0/0</div>
      <div class="lbl">স্কোর</div>
    </div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="btn-group">
      <button class="btn-secondary" id="reviewBtn">ভুল উত্তরগুলো দেখো</button>
      <button class="btn-primary" id="restartBtn" style="margin-top:0;">আবার শুরু করো</button>
    </div>
    <div class="review-list" id="reviewList" style="display:none;"></div>
  </div>
</div>

<script>
const DATA = {
"ব্রায়োফাইটা ও টেরিডোফাইটা": [
["বাংলাদেশে Riccia গণের কতটি প্রজাতি সনাক্ত হয়েছে?",["২৫টি","৩৫টি","৪৫টি","৫৫টি"],2],
["মস বা ব্রায়োফাইটে মূলের পরিবর্তে থাকে—",["রাইজোম","রাইজয়েড","মূলরোম","স্টোলন"],1],
["উভচর উদ্ভিদ বলা হয়—",["টেরিডোফাইটকে","ব্রায়োফাইটকে","শৈবালকে","ছত্রাককে"],1],
["ব্রায়োফাইটের নিষেকের জন্য প্রয়োজন—",["বায়ু","তরল মাধ্যম","পতঙ্গ","শুষ্ক মাটি"],1],
["ব্রায়োফাইটের শুক্রাণুতে ফ্ল্যাজেলা থাকে—",["১টি","২টি","৩টি","৪টি"],1],
["লিভারওয়ার্ট বলা হয়—",["Pteris-কে","Riccia (Hepaticae)-কে","Chara-কে","Ulothrix-কে"],1],
["স্পোরোফাইট আদি প্রকৃতির এবং থ্যালাসের মধ্যে নিয়োজিত থাকে কোন উদ্ভিদে?",["Pteris","Chlamydomonas","Riccia sp.","Agaricus"],2],
["Riccia-র কোন প্রজাতি জলজ?",["Riccia glauca","Riccia fluitans","Riccia discolor","Riccia sorocarpa"],1],
["Riccia-র থ্যালাসগুলোর গোলাপের পাপড়ির মতো সজ্জাকে বলে—",["থ্যালোজ","রোসেট","ফ্রন্ড","পাইলিয়াস"],1],
["Pteris-এর স্পোরোফাইটের প্রথম কোষ—",["স্পোর","উস্পোর (oospore)","জাইগোট","ভ্রূণ"],1],
["পৃথিবীর আদিমতম ভাস্কুলার (পরিবহন টিস্যুযুক্ত) উদ্ভিদ বলে বিবেচিত—",["ব্রায়োফাইটা","টেরিডোফাইটা","শৈবাল","ছত্রাক"],1],
["সান ফার্ন বলা হয়—",["Riccia-কে","Pteris-কে","Chara-কে","Ulothrix-কে"],1],
["ফার্নের (স্পোরোফাইটিক) মিয়োসিস ঘটে—",["মূলে","জনন মাতৃকোষে","কাণ্ডে","পত্ররন্ধ্রে"],1],
["ফার্নের রাইজোমে বাদামী বর্ণের শল্কপত্রকে বলে—",["ক্রোজিয়ার","রামেন্টা","স্পোরোফিল","ইন্ডুসিয়াম"],1],
["ফার্নের কুন্ডলিত কচি পাতাকে বলা হয়—",["রামেন্টা","ক্রোজিয়ার","সোরাস","প্রোথ্যালাস"],1],
["সোরাস উৎপন্নকারী পাতাকে বলা হয়—",["ফ্রন্ড","স্পোরোফিল","রামেন্টা","থ্যালাস"],1],
["Pteris-এর গ্যামিটোফাইট (প্রোথ্যালাস) কেমন?",["মূলাকার ও বর্ণহীন","হৃদপিন্ডাকার, সবুজ, হ্যাপ্লয়েড","গোলাকার ও ডিপ্লয়েড","শাখাযুক্ত ও বর্ণহীন"],1],
["নোট অনুযায়ী, পুংজননাঙ্গকে বলা হয়—",["অ্যান্থেরিডিয়াম","আর্কিগোনিয়াম","সোরাস","ইন্ডুসিয়াম"],1],
["সোরাস তৈরি হয়—",["যৌন পদ্ধতিতে","অযৌন পদ্ধতিতে","উভয় পদ্ধতিতে","কোনোটিই নয়"],1],
["Riccia পরিবেশের কীসের সূচক হিসেবে কাজ করে?",["মাটি দূষণ","পরিবেশ দূষণ","পানি ঘাটতি","তাপমাত্রা বৃদ্ধি"],1],
["Pteris-এর স্পোরাঞ্জিয়াম কী দিয়ে ঢাকা থাকে?",["প্রকৃত ইন্ডুসিয়াম","ফলস্ ইন্ডুসিয়াম","রামেন্টা","থ্যালাস"],1],
["Pteris তথা ফার্নের শুক্রাণু কেমন?",["নিশ্চল, একফ্ল্যাজেলা","সচল, বহু ফ্ল্যাজেলাবিশিষ্ট","নিশ্চল, ফ্ল্যাজেলাবিহীন","সচল, একফ্ল্যাজেলা"],1]
],
"কোষ বিভাজন": [
["দেহে টিউমার ছড়িয়ে পড়াকে বলে—",["Necrosis","Metastasis","Apoptosis","Mitosis"],1],
["মিয়োসিস কোষ বিভাজন প্রথম প্রত্যক্ষ করেন—",["ফ্লেমিং","বোভেরি","মর্গান","মেন্ডেল"],1],
["কোষ বিভাজন আবিষ্কার করেন—",["বোভেরি","ডব্লিউ ফ্লেমিং","মর্গান","স্ট্রাসবার্গার"],1],
["কোষচক্রে ব্যয়িত সময়ের হার হলো—",["৫০-৬০%","৭০-৮০%","৯০-৯৫%","২০-৩০%"],2],
["মাইটোসিসের কোন পর্যায়ে স্পিন্ডল ফাইবার অদৃশ্য হয়?",["প্রোফেজ","মেটাফেজ","অ্যানাফেজ","টেলোফেজ"],3],
["যেসব ডিপ্লয়েড কোষে মিয়োসিস ঘটে তাকে বলে—",["গ্যামেট","মিয়োসাইট","স্পোরোসাইট","জাইগোট"],1],
["স্পিন্ডলের বিষুবীয় অঞ্চলে ক্রোমোজোম বিন্যস্ত হওয়াকে বলে—",["সিন্যাপসিস","মেটাকাইনেসিস","ক্যারিওকাইনেসিস","কনডেনসেশন"],1],
["জনুক্রমে ভূমিকা রাখে—",["মাইটোসিস","মিয়োসিস","উভয়ই","কোনোটিই নয়"],1],
["মাইটোসিসের কোন ধাপে কোষপ্লেটের সূচনা ঘটে?",["প্রোফেজ","মেটাফেজ","অ্যানাফেজ","টেলোফেজ"],3],
["মাইটোসিসের কোন দশায় ক্রোমোজোম বিষুবীয় অঞ্চলে বিন্যস্ত হয়?",["প্রোফেজ","মেটাফেজ","অ্যানাফেজ","টেলোফেজ"],1],
["ক্রসিং ওভার ঘটে—",["মাইটোসিসের মেটাফেজে","মিয়োসিসের প্রফেজ-১ এ","মিয়োসিসের অ্যানাফেজ-২ এ","ইন্টারফেজে"],1],
["ক্রোমোজোমের খাটো ও মোটা হওয়াকে বলে—",["সিন্যাপসিস","কনডেনসেশন","টার্মিনালাইজেশন","মেটাকাইনেসিস"],1],
["দুটি হোমোলোগাস ক্রোমোজোমের মধ্যে জোড় সৃষ্টি হওয়াকে বলে—",["কনডেনসেশন","সিন্যাপসিস","মেটাকাইনেসিস","ক্যারিওকাইনেসিস"],1],
["ক্রসিং ওভার সম্পর্কে সর্বপ্রথম ধারণা দেন—",["বোভেরি","থমাস হান্ট মর্গান","ফ্লেমিং","মেন্ডেল"],1],
["নিউক্লিয়াসের বিভাজনকে বলে—",["সাইটোকাইনেসিস","ক্যারিওকাইনেসিস","মেটাকাইনেসিস","কনডেনসেশন"],1],

    <span class="count">${DATA[ch].length}টি</span>`;
  div.onclick = (e) => {
    if(e.target.tagName !== 'INPUT'){
      const cb = div.querySelector('input');
      cb.checked = !cb.checked;
    }
  };
  chapterList.appendChild(div);
});

document.getElementById('startBtn').onclick = () => {
  const checked = [...chapterList.querySelectorAll('input:checked')].map(i => Object.keys(DATA)[i.dataset.ch]);
  if(checked.length === 0){ alert('অন্তত একটি অধ্যায় বাছাই করো।'); return; }
  selectedQuestions = [];
  checked.forEach(ch => {
    DATA[ch].forEach(q => selectedQuestions.push({chapter: ch, q: q[0], options: q[1], correct: q[2]}));
  });
  if(document.getElementById('orderSelect').value === 'random'){
    for(let i = selectedQuestions.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [selectedQuestions[i], selectedQuestions[j]] = [selectedQuestions[j], selectedQuestions[i]];
    }
  }
  currentIndex = 0; score = 0; wrongAnswers = [];
  document.getElementById('setupPanel').style.display = 'none';
  document.getElementById('resultPanel').style.display = 'none';
  document.getElementById('quizPanel').style.display = 'block';
  showQuestion();
};

function showQuestion(){
  answered = false;
  const item = selectedQuestions[currentIndex];
  document.getElementById('chapterTag').textContent = item.chapter;
  document.getElementById('qCounter').textContent = `প্রশ্ন ${currentIndex+1} / ${selectedQuestions.length}`;
  document.getElementById('progressFill').style.width = `${(currentIndex/selectedQuestions.length)*100}%`;
  document.getElementById('qText').textContent = item.q;
  const box = document.getElementById('optionsBox');
  box.innerHTML = '';
  item.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<span class="letter">${LETTERS[idx]}</span><span>${opt}</span>`;
    div.onclick = () => selectOption(idx, div);
    box.appendChild(div);
  });
  document.getElementById('nextBtn').classList.remove('active');
  document.getElementById('skipBtn').style.display = 'inline-block';
}

function selectOption(idx, el){
  if(answered) return;
  answered = true;
  const item = selectedQuestions[currentIndex];
  const opts = document.querySelectorAll('.option');
  opts.forEach(o => o.classList.add('disabled'));
  if(idx === item.correct){
    el.classList.add('correct');
    score++;
  } else {
    el.classList.add('wrong');
    opts[item.correct].classList.add('correct');
    wrongAnswers.push({...item, yourAnswer: item.options[idx]});
  }
  document.getElementById('nextBtn').classList.add('active');
  document.getElementById('skipBtn').style.display = 'none';
}

document.getElementById('nextBtn').onclick = () => {
  currentIndex++;
  if(currentIndex >= selectedQuestions.length){
    finishQuiz();
  } else {
    showQuestion();
  }
};

document.getElementById('skipBtn').onclick = () => {
  const item = selectedQuestions[currentIndex];
  wrongAnswers.push({...item, yourAnswer: '(এড়িয়ে গেছো)'});
  currentIndex++;
  if(currentIndex >= selectedQuestions.length){
    finishQuiz();
  } else {
    showQuestion();
  }
};

function finishQuiz(){
  document.getElementById('quizPanel').style.display = 'none';
  document.getElementById('resultPanel').style.display = 'block';
  document.getElementById('scoreNum').textContent = `${score}/${selectedQuestions.length}`;
  const pct = Math.round((score/selectedQuestions.length)*100);
  let msg = '';
  if(pct >= 90) msg = 'wooo bhai shei pora disis to 🎉';
  else if(pct >= 70) msg = 'valo korsis,r ekbr xm da de mone thkbe 👍';
  else if(pct >= 50) msg = 'মোটামুটি, ar 2 3 bar xm de💪';
  else msg = 'sala bncd vlo kori por age trpr xm dibir asis📖';
  document.getElementById('resultMsg').textContent = `${pct}% সঠিক — ${msg}`;
  document.getElementById('reviewList').style.display = 'none';
  document.getElementById('reviewBtn').textContent = 'ভুল উত্তরগুলো দেখো';
}

document.getElementById('reviewBtn').onclick = () => {
  const rl = document.getElementById('reviewList');
  if(rl.style.display === 'none'){
    if(wrongAnswers.length === 0){
      rl.innerHTML = '<p style="color:var(--muted);text-align:center;">korsis ki bhai,,,if you are a girl i love you,will u marry me....else mama tui kintu sheu chalai ja 🎉</p>';
    } else {
      rl.innerHTML = wrongAnswers.map(w => `
        <div class="review-item">
          <div style="color:var(--accent2);font-size:0.8rem;margin-bottom:4px;">${w.chapter}</div>
          <div>${w.q}</div>
          <div style="margin-top:6px;">তোমার উত্তর: <span class="yours">${w.yourAnswer}</span></div>
          <div>সঠিক উত্তর: <span class="ans">${w.options[w.correct]}</span></div>
        </div>
      `).join('');
    }
    rl.style.display = 'block';
    document.getElementById('reviewBtn').textContent = 'রিভিউ লুকাও';
  } else {
    rl.style.display = 'none';
    document.getElementById('reviewBtn').textContent = 'ভুল উত্তরগুলো দেখো';
  }
};

document.getElementById('restartBtn').onclick = () => {
  document.getElementById('resultPanel').style.display = 'none';
  document.getElementById('setupPanel').style.display = 'block';
};
</script>
</body>
</html>
